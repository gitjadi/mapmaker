<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapMaker</title>
  <meta name="description" content="Design maps in the browser – layers, labels, symbols and background maps.">
  <link rel="icon" href="./icon.png">
  <link rel="stylesheet" href="./assets/app-013250c809.css">
</head>
<body>
  <div id="app">
    <header id="menubar">
      <div class="brand"><img src="./icon.png" alt=""><span>MapMaker</span></div>
      <nav id="menus"></nav>
      <div id="doc-title" title="Map title – click to rename"></div>
      <div class="spacer"></div>
      <div id="save-state"></div>
      <button id="page-toggle" class="page-toggle" title="Show the map on the printed page (Ctrl+L)">Page</button>
    </header>
    <div id="optionsbar"></div>
    <main id="workspace">
      <aside id="toolbar"></aside>
      <section id="stage">
        <div id="map-area">
          <canvas id="map"></canvas>
          <div id="attribution"></div>
          <div id="hint"></div>
        </div>
        <div id="table-panel"></div>
      </section>
      <aside id="sidebar">
        <section class="panel" id="properties-panel">
          <div class="panel-head"><span>Properties</span></div>
          <div class="panel-body" id="properties"></div>
        </section>
        <section class="panel" id="layers-panel">
          <div class="panel-head"><span>Layers</span></div>
          <div id="layer-controls"></div>
          <div class="panel-body" id="layers"></div>
          <div id="layer-buttons"></div>
        </section>
      </aside>
    </main>
    <footer id="statusbar">
      <span id="status-msg"></span>
      <span class="spacer"></span>
      <span id="status-page"></span>
      <span id="status-coords"></span>
      <span id="status-scale"></span>
    </footer>
  </div>
  <div id="overlay"></div>
  <script type="module" src="./assets/app-b004829893.js"></script>
</body>
</html>
